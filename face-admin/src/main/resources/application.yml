# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 代码生成
gen:
  # 作者
  author: developer
  # 默认生成包路径 system 需改成自己的模块名称 如 system monitor tool
  packageName: com.ruoyi.project.face
  # 自动去除表前缀，默认是true
  autoRemovePre: false
  # 表前缀（生成类名不会包含表前缀，多个用逗号分隔）
  tablePrefix: sys_

# 敏感项请在 application-local.yml（已 gitignore）中覆盖；见 application-local.yml.example
wx:
  appid: your-wechat-appid
  secret: your-wechat-secret
  templateId: "your-checkin-template-id"
  # 课堂点评专用模板（与签到 templateId 分开配置）；须加引号，避免 YAML 解析异常
  reviewTemplateId: "your-review-template-id"
  review-template-id: "your-review-template-id"

  h5BaseUrl: https://student.example.com
  apiBaseUrl: https://face.example.com/prod-api
  # 打卡详情链接 HMAC 密钥，生产环境务必更换为随机长字符串
  recordSignSecret: CHANGE_ME_RECORD_SIGN_SECRET

# 百度云人脸识别（打卡终端）
# 测试/本地与生产必须使用不同 group-id，避免学生 ID 冲突互相覆盖人脸
baidu:
  face:
    enabled: true
    app-id: "your-baidu-app-id"
    api-key: "your-baidu-api-key"
    secret-key: "your-baidu-secret-key"
    group-id: students_dev
    score-threshold: 80

# 人脸引擎路由
# search-provider: baidu | local （搜索只能选一个）
# register-baidu / register-local: 注册可同时开启
face:
  engine:
    search-provider: local
    register-baidu: true
    register-local: true
  local:
    base-url: http://127.0.0.1:8080
    api-prefix: /api/v1
    similarity-threshold: 0.55
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
